<!-- Scanline Laser Gradient -->
<linearGradient id="scan-laser" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
  <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.35" />
  <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.9" />
</linearGradient>

<!-- Glowing Blur Filter -->
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="4" result="blur" />
  <feComposite in="SourceGraphic" in2="blur" operator="over" />
</filter>

<style>
  @keyframes scanbeam {
    0% { transform: translateY(0px); opacity: 0.2; }
    50% { transform: translateY(370px); opacity: 1; }
    100% { transform: translateY(0px); opacity: 0.2; }
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .laser-scan {
    animation: scanbeam 4s ease-in-out infinite;
  }
  .pulse-live {
    animation: pulse-dot 1.5s ease-in-out infinite;
  }
  .mono-text {
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
  }
</style>


<!-- macOS Buttons -->
<circle cx="24" cy="20" r="5" fill="#ff5f56" />
<circle cx="40" cy="20" r="5" fill="#ffbd2e" />
<circle cx="56" cy="20" r="5" fill="#27c93f" />

<!-- Terminal Path Title -->
<text x="450" y="24" class="mono-text" font-size="12" font-weight="600" fill="#a0aec0" text-anchor="middle">
  zecodee@github ~ $ ./profile-scan --live
</text>

<!-- Live Status Indicator -->
<circle cx="820" cy="20" r="4" fill="#00f0ff" class="pulse-live" />
<text x="832" y="24" class="mono-text" font-size="11" font-weight="700" fill="#00f0ff" letter-spacing="1">LIVE</text>


